name: Multi Jobs

on:
  push:
    branches:
      - master

jobs:
  job-build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v7
      - name: install cowsay
        run: | 
           sudo apt-get update
           sudo apt-get install -y cowsay
      - name: Run cowsay build
        run: cowsay -f elephant "I'm a elephant" >> elephant.txt

  job-test:
    needs: job-build
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Run sleep
        run: for i in {1..10}; do
            echo "Job 2 sleeping for $i seconds && sleep 1"
           done
      - name: check elephant.txt
        run: ls elephant.txt
     
  job-deploy:
    needs: job-test
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: cat elephant.txt
        run: cat elephant.txt
      - name: deploy elephant
        run: echo "deploying elephant "