name: Testing github workflow

on: push

jobs:
  onest_github_action:
    runs-on: ubuntu-latest
    steps:
      - name: OS name
        run: cat /etc/os-release

      - name: date
        run: date

      - name: user
        run: id

      - name: This is all
        run: echo "this is all. done"
      - name:  sleeping 5
        run: sleep 5
             echo "I slept for 5 seconds"
             if [ $? -eq 0 ]; then
                echo "I'm root"
             fi
      - name:  sleeping 10
        run: sleep 10
        run: echo "I slept for 10 seconds"
        if [ $? -eq 0 ]; then
            echo "I'm root again"
            else
            echo "I'm not root"
        fi
        if [ $USER = "root" ]; then
      - name:  checkout-repo
        uses: actions/checkout@v7